# Terminate TLS in front of this (Caddy, a cloud LB, or add listen 443 ssl here).
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Reject oversized bodies before they reach the app (app cap is 10 MB + overhead).
    client_max_body_size 11m;
    client_body_timeout 30s;

    location / {
        limit_req zone=perip burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: the app trusts X-Real-IP when SHER_TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }
}
